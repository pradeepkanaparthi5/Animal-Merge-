<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animal Merge - Developed by PradeepGamings</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --border-color: #0f3460;
            --text-color: #e94560;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #2a2a4e, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            touch-action: none; /* Prevent zooming and scrolling on mobile */
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            max-height: 800px;
            background: rgba(22, 33, 62, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top UI */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #score-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            margin-top: 4px;
        }

        .next-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            text-align: center;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #next-animal {
            font-size: 32px;
            line-height: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 20px 0;
            color: var(--text-color);
            text-shadow: 0 4px 10px rgba(233, 69, 96, 0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ddd;
            text-align: center;
            padding: 0 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: var(--text-color);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #ff5270;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .developer-credit {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            z-index: 15;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Particles Layer */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 6;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="ui-layer">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div id="score-val">0</div>
            </div>
            <div class="next-box">
                <div class="score-label">Next</div>
                <div id="next-animal">❓</div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        <canvas id="particles"></canvas>
        
        <div class="developer-credit">
            Developed by PradeepGamings
        </div>

        <div id="start-screen" class="overlay active">
            <h1>Animal Merge</h1>
            <p>Drop animals. Match identical ones to evolve them!<br><br>Don't let them overflow!</p>
            <button onclick="startGame()">Play Now</button>
        </div>

        <div id="game-over-screen" class="overlay">
            <h1>Game Over</h1>
            <p>You ran out of space!</p>
            <p style="font-size: 24px; color: #fff;">Final Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game Configuration & Data
        const ANIMALS = [
            { level: 0, emoji: '🐭', radius: 18,  color: '#ffb3ba', score: 2 },
            { level: 1, emoji: '🐰', radius: 26,  color: '#ffdfba', score: 4 },
            { level: 2, emoji: '🐱', radius: 36,  color: '#ffffba', score: 8 },
            { level: 3, emoji: '🐶', radius: 48,  color: '#baffc9', score: 16 },
            { level: 4, emoji: '🦊', radius: 62,  color: '#bae1ff', score: 32 },
            { level: 5, emoji: '🐻', radius: 78,  color: '#d0bdf4', score: 64 },
            { level: 6, emoji: '🦁', radius: 96,  color: '#f4c2c2', score: 128 },
            { level: 7, emoji: '🐯', radius: 116, color: '#f3e5ab', score: 256 },
            { level: 8, emoji: '🐘', radius: 138, color: '#c5e384', score: 512 },
            { level: 9, emoji: '🦕', radius: 162, color: '#97d2fb', score: 1024 },
            { level: 10, emoji: '🐉',radius: 190, color: '#ffb6b9', score: 2048 }
        ];

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const particleCanvas = document.getElementById('particles');
        const pCtx = particleCanvas.getContext('2d');

        // Internal Game Resolution (Fixed for consistent physics)
        const GAME_WIDTH = 450;
        const GAME_HEIGHT = 800;
        
        // Physics Constants
        const GRAVITY = 0.4;
        const DAMPING = 0.99;
        const WALL_BOUNCE = 0.3;
        const SUB_STEPS = 5;
        const DEATH_LINE_Y = 120; // Y coordinate for game over threshold

        // State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let bodies = [];
        let particles = [];
        let score = 0;
        let dropX = GAME_WIDTH / 2;
        let currentAnimal = null;
        let nextAnimal = null;
        let isCooldown = false;
        let mouseX = 0;
        let lastTime = performance.now();

        // Responsive Canvas Sizing
        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            const rect = wrapper.getBoundingClientRect();
            
            // Set actual canvas size based on device pixel ratio for crispness
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            particleCanvas.width = rect.width * dpr;
            particleCanvas.height = rect.height * dpr;
            
            // Scale context to match coordinate system mapping to screen
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset
            ctx.scale((rect.width / GAME_WIDTH) * dpr, (rect.height / GAME_HEIGHT) * dpr);
            
            pCtx.setTransform(1, 0, 0, 1, 0, 0);
            pCtx.scale((rect.width / GAME_WIDTH) * dpr, (rect.height / GAME_HEIGHT) * dpr);
        }

        window.addEventListener('resize', resizeCanvas);

        // Body Class (Physics entity)
        class Body {
            constructor(x, y, typeInfo) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = typeInfo;
                this.radius = typeInfo.radius;
                this.mass = this.radius * this.radius; // Mass proportional to area
                this.merged = false;
                this.settleTimer = 0;
                this.scale = 0; // For spawn animation
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10 - 2;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 5 + 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += GRAVITY * 0.5;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Input Handling
        function updateDropX(clientX) {
            if (gameState !== 'PLAYING' || isCooldown) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            
            mouseX = (clientX - rect.left) * scaleX;
            
            // Constrain to walls based on current animal radius
            const r = currentAnimal ? currentAnimal.radius : 0;
            dropX = Math.max(r, Math.min(GAME_WIDTH - r, mouseX));
        }

        function dropAnimal() {
            if (gameState !== 'PLAYING' || isCooldown || !currentAnimal) return;
            
            const newBody = new Body(dropX, DEATH_LINE_Y - currentAnimal.radius - 10, currentAnimal);
            bodies.push(newBody);
            
            isCooldown = true;
            currentAnimal = null;
            
            setTimeout(() => {
                if (gameState === 'PLAYING') {
                    currentAnimal = nextAnimal;
                    nextAnimal = getRandomAnimal();
                    updateNextUI();
                    isCooldown = false;
                    // Re-evaluate dropX immediately based on new animal radius
                    updateDropX(canvas.getBoundingClientRect().left + (dropX / (GAME_WIDTH / canvas.getBoundingClientRect().width))); 
                }
            }, 800); // 0.8s cooldown
        }

        // Event Listeners
        window.addEventListener('mousemove', (e) => updateDropX(e.clientX));
        window.addEventListener('touchmove', (e) => updateDropX(e.touches[0].clientX), {passive: false});
        
        window.addEventListener('mousedown', dropAnimal);
        window.addEventListener('touchstart', (e) => {
            updateDropX(e.touches[0].clientX);
            dropAnimal();
        }, {passive: false});

        function getRandomAnimal() {
            // Spawn levels 0 to 3
            const level = Math.floor(Math.random() * 4);
            return ANIMALS[level];
        }

        function updateNextUI() {
            document.getElementById('next-animal').innerText = nextAnimal ? nextAnimal.emoji : '';
        }

        function addScore(points) {
            score += points;
            document.getElementById('score-val').innerText = score;
            document.getElementById('score-val').style.transform = 'scale(1.3)';
            setTimeout(() => {
                document.getElementById('score-val').style.transform = 'scale(1)';
                document.getElementById('score-val').style.transition = 'transform 0.2s';
            }, 50);
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkGameOver() {
            let gameOver = false;
            for (let b of bodies) {
                if (b.y - b.radius < DEATH_LINE_Y) {
                    // Only game over if it's settled (moving very slowly) and inside bounds
                    if (Math.abs(b.vx) < 0.5 && Math.abs(b.vy) < 0.5) {
                        b.settleTimer += 16; // rough ms estimation
                        if (b.settleTimer > 1500) { // 1.5 seconds above line
                            gameOver = true;
                            break;
                        }
                    } else {
                        b.settleTimer = 0;
                    }
                } else {
                    b.settleTimer = 0;
                }
            }
            
            if (gameOver) {
                gameState = 'GAMEOVER';
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').classList.add('active');
            }
        }

        // Custom Physics Engine Step
        function physicsStep() {
            const dt = 1 / 60;
            const subDt = dt / SUB_STEPS;
            let merges = [];

            for (let step = 0; step < SUB_STEPS; step++) {
                // Apply Gravity and integrate velocity
                for (let i = 0; i < bodies.length; i++) {
                    let b = bodies[i];
                    if (b.merged) continue;

                    b.vy += GRAVITY;
                    b.x += b.vx * subDt * 60; 
                    b.y += b.vy * subDt * 60;
                    
                    b.vx *= DAMPING;
                    b.vy *= DAMPING;

                    // Floor Collision
                    if (b.y + b.radius > GAME_HEIGHT) {
                        b.y = GAME_HEIGHT - b.radius;
                        b.vy *= -WALL_BOUNCE;
                        b.vx *= 0.8; // Friction
                    }
                    
                    // Wall Collision
                    if (b.x - b.radius < 0) {
                        b.x = b.radius;
                        b.vx *= -WALL_BOUNCE;
                    } else if (b.x + b.radius > GAME_WIDTH) {
                        b.x = GAME_WIDTH - b.radius;
                        b.vx *= -WALL_BOUNCE;
                    }
                }

                // Circle - Circle Collision
                for (let i = 0; i < bodies.length; i++) {
                    for (let j = i + 1; j < bodies.length; j++) {
                        let b1 = bodies[i];
                        let b2 = bodies[j];
                        
                        if (b1.merged || b2.merged) continue;

                        let dx = b2.x - b1.x;
                        let dy = b2.y - b1.y;
                        let distSq = dx*dx + dy*dy;
                        let radSum = b1.radius + b2.radius;

                        if (distSq < radSum*radSum) {
                            let dist = Math.sqrt(distSq);
                            if (dist === 0) { dist = 0.01; dx = 0.01; } // Prevent div zero

                            // Check Merge
                            if (b1.type.level === b2.type.level && b1.type.level < ANIMALS.length - 1) {
                                b1.merged = true;
                                b2.merged = true;
                                merges.push({ b1, b2 });
                                continue;
                            }

                            // Positional Correction (solve overlap)
                            let overlap = radSum - dist;
                            let nx = dx / dist;
                            let ny = dy / dist;

                            // Mass ratios for balanced pushing
                            let mRatio1 = b2.mass / (b1.mass + b2.mass);
                            let mRatio2 = b1.mass / (b1.mass + b2.mass);

                            b1.x -= nx * overlap * mRatio1;
                            b1.y -= ny * overlap * mRatio1;
                            b2.x += nx * overlap * mRatio2;
                            b2.y += ny * overlap * mRatio2;

                            // Velocity Resolution (Bounce)
                            let dvx = b2.vx - b1.vx;
                            let dvy = b2.vy - b1.vy;
                            let velAlongNormal = dvx * nx + dvy * ny;

                            if (velAlongNormal > 0) continue; // Moving apart

                            let restitution = 0.1; // Low bounce
                            let jImpulse = -(1 + restitution) * velAlongNormal;
                            jImpulse /= (1 / b1.mass + 1 / b2.mass);

                            let impulseX = jImpulse * nx;
                            let impulseY = jImpulse * ny;

                            b1.vx -= impulseX / b1.mass;
                            b1.vy -= impulseY / b1.mass;
                            b2.vx += impulseX / b2.mass;
                            b2.vy += impulseY / b2.mass;
                        }
                    }
                }
            }

            // Process Merges after sub-steps
            for (let m of merges) {
                let midX = (m.b1.x + m.b2.x) / 2;
                let midY = (m.b1.y + m.b2.y) / 2;
                
                let nextLevelInfo = ANIMALS[m.b1.type.level + 1];
                let newBody = new Body(midX, midY, nextLevelInfo);
                
                // Add a small upwards bounce for juice
                newBody.vy = -3;
                
                bodies.push(newBody);
                addScore(nextLevelInfo.score);
                spawnParticles(midX, midY, nextLevelInfo.color);
            }

            // Clean up merged bodies
            bodies = bodies.filter(b => !b.merged);
        }

        // Render Step
        function draw() {
            // Background
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Draw container walls (Optional styling)
            ctx.strokeStyle = '#0f3460';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, GAME_HEIGHT);
            ctx.lineTo(GAME_WIDTH, GAME_HEIGHT);
            ctx.lineTo(GAME_WIDTH, 0);
            ctx.stroke();

            // Death Line
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, DEATH_LINE_Y);
            ctx.lineTo(GAME_WIDTH, DEATH_LINE_Y);
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Draw current aiming animal
            if (gameState === 'PLAYING' && currentAnimal && !isCooldown) {
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(dropX, DEATH_LINE_Y - currentAnimal.radius - 10, currentAnimal.radius, 0, Math.PI * 2);
                ctx.fillStyle = currentAnimal.color;
                ctx.fill();
                
                ctx.font = `${currentAnimal.radius * 1.2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentAnimal.emoji, dropX, DEATH_LINE_Y - currentAnimal.radius - 10);
                
                // Aim line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(dropX, DEATH_LINE_Y);
                ctx.lineTo(dropX, GAME_HEIGHT);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // Draw Bodies
            for (let b of bodies) {
                // Spawn Animation
                if (b.scale < 1) b.scale += 0.1;
                if (b.scale > 1) b.scale = 1;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.scale(b.scale, b.scale);

                // Circle Background
                ctx.beginPath();
                ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.type.color;
                ctx.fill();
                
                // Highlight for 3D sphere look
                let grad = ctx.createRadialGradient(-b.radius*0.3, -b.radius*0.3, b.radius*0.1, 0, 0, b.radius);
                grad.addColorStop(0, 'rgba(255,255,255,0.6)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fill();

                // Border
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Emoji
                ctx.font = `${b.radius * 1.2}px 'Segoe UI Emoji', Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.type.emoji, 0, 2); // slight y offset for visual center

                ctx.restore();
            }

            // Draw Particles (Separate Canvas for performance/layering)
            pCtx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(pCtx);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Main Game Loop
        function loop(timestamp) {
            requestAnimationFrame(loop);

            if (gameState === 'PLAYING') {
                physicsStep();
                checkGameOver();
            }

            draw();
        }

        // Game Flow Controls
        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            resetGameLogic();
            gameState = 'PLAYING';
        }

        function resetGame() {
            document.getElementById('game-over-screen').classList.remove('active');
            resetGameLogic();
            gameState = 'PLAYING';
        }

        function resetGameLogic() {
            bodies = [];
            particles = [];
            score = 0;
            addScore(0);
            currentAnimal = getRandomAnimal();
            nextAnimal = getRandomAnimal();
            updateNextUI();
            isCooldown = false;
        }

        // Initialization
        resizeCanvas();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
